name: CI for Spring Boot Microservices

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: andyg
          POSTGRES_PASSWORD: mypassword123   # Non-empty password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U andyg -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U andyg -d postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Test user-service
        working-directory: docker/user-service
        run: ./mvnw test

      - name: Test product-service
        working-directory: docker/product-service
        run: ./mvnw test

      - name: Get Git Version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Images
        run: |
          for service in user-service product-service order-service; do
            cd docker/$service
            ./mvnw clean package -DskipTests
            docker build -t ${{ secrets.DOCKER_USERNAME }}/$service:$VERSION .
            docker tag ${{ secrets.DOCKER_USERNAME }}/$service:$VERSION ${{ secrets.DOCKER_USERNAME }}/$service:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/$service:$VERSION
            docker push ${{ secrets.DOCKER_USERNAME }}/$service:latest
            cd ../..
          done

      - name: Integration Test with Docker Compose
        run: |
          docker compose -f docker/order-service/docker-compose.yml up -d
          docker exec order-service-order-service-1 ./mvnw test

      - name: Checkout ArgoCD Repository
        uses: actions/checkout@v4
        with:
          repository: samahmoumen/argo1
          token: ${{ secrets.GH_TOKEN }}
          path: argo1

      - name: Update ArgoCD Deployment Files
        working-directory: argo1
        run: |
          git config --global user.email "ci-bot---1@example.com"
          git config --global user.name "ci-bot---1"

          # Update Docker image tags in YAML files
          for service in user-service product-service order-service; do
            sed -i -e "s|.*/$service:.*|${{ secrets.DOCKER_USERNAME }}/$service:$VERSION|g" $service.yaml
          done

          git add -A
          git commit -m "Update YAML files to $VERSION"
          git push
